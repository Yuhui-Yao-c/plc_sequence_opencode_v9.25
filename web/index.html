<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC 步序采集工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">PLC</span>
      <span class="title">步序采集</span>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">历史 Run</div>
      <ul id="runList" class="run-list">
        <li class="run-empty">加载中...</li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <button id="btnNewTask" class="btn btn-primary btn-block">+ 发起新任务</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span id="currentRunName" class="topbar-run">未选择 Run</span>
        <span id="currentRunStatus" class="badge badge-muted">—</span>
      </div>
      <div class="topbar-right">
        <div class="calib-toggle" id="calibToggle">
          <span class="calib-label">校准模式</span>
          <label class="switch">
            <input type="checkbox" id="calibCheck">
            <span class="slider"></span>
          </label>
          <span class="calib-state" id="calibState">关闭</span>
        </div>
        <span class="ver">v9.25</span>
      </div>
    </header>

    <div class="content">
      <!-- 发起新任务 -->
      <section id="sectionNew" class="section">
        <div class="section-header">
          <h2>发起新任务</h2>
          <button id="btnCloseNew" class="btn-icon" title="收起">×</button>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">源码 XML <span class="req">*</span></label>
            <div class="form-input">
              <input type="text" id="inpSource" class="input" placeholder="选择 PLC 源码文件">
              <button class="btn btn-ghost" onclick="browseFile('inpSource','file','选择源码XML')">选择</button>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">匹配格式 <span class="req">*</span></label>
            <div class="form-input">
              <input type="text" id="inpPattern" class="input" placeholder="如 ST*.AutoStep[*] 或 EM*.Process_steps[*]">
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">输出文件夹</label>
            <div class="form-input">
              <input type="text" id="inpOutputRoot" class="input" placeholder="默认 = XML 同级 output 文件夹">
              <button class="btn btn-ghost" onclick="browseFile('inpOutputRoot','dir','选择输出文件夹')">选择</button>
            </div>
          </div>
          <div class="form-row form-row-calib" id="rowManual" style="display:none;">
            <label class="form-label">人工表 <span class="req">*</span></label>
            <div class="form-input">
              <input type="text" id="inpManual" class="input" placeholder="校准模式必填">
              <button class="btn btn-ghost" onclick="browseFile('inpManual','file','选择人工采集表')">选择</button>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Trace <span class="opt">可选</span></label>
            <div class="form-input">
              <input type="text" id="inpTrace" class="input" placeholder="运行时 trace 文件">
              <button class="btn btn-ghost" onclick="browseFile('inpTrace','file','选择trace文件')">选择</button>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button id="btnPredict" class="btn btn-primary btn-large">开始执行</button>
          <span class="hint-text">点击后 OpenCode 将在后台自主完成全流程，实时进度请看后台窗口</span>
        </div>
      </section>

      <!-- 执行进度（简化版：只有状态卡片） -->
      <section id="sectionProgress" class="section" style="display:none;">
        <div class="section-header">
          <h2>执行进度</h2>
          <div class="header-right">
            <span id="progressStats" class="progress-stats"></span>
            <span id="jobStatusBadge" class="badge badge-warn">运行中</span>
          </div>
        </div>
        <div class="phase-hero" id="phaseHero">
          <div class="phase-hero-icon" id="phaseHeroIcon">⏳</div>
          <div class="phase-hero-body">
            <div class="phase-hero-label">当前阶段</div>
            <div class="phase-hero-name" id="phaseHeroName">运行中</div>
            <div class="phase-hero-desc" id="phaseHeroDesc">OpenCode 正在后台执行，请查看后台窗口了解实时进度。</div>
          </div>
        </div>
      </section>

      <!-- 任务结果 -->
      <section id="sectionResultSummary" class="section" style="display:none;">
        <div class="section-header"><h2>执行结果</h2></div>
        <div class="cards" id="cardsContainer"></div>
        <div class="result-summary" id="resultSummary"></div>
      </section>

      <!-- 覆盖率框（校准模式） -->
      <section id="sectionCoverage" class="section section-coverage" style="display:none;">
        <div class="section-header"><h2>覆盖率指标（校准模式）</h2></div>
        <div class="coverage-box" id="coverageBox">
          <div class="coverage-empty">尚未生成覆盖率评价</div>
        </div>
      </section>

      <!-- 结果预览 -->
      <section id="sectionResult" class="section" style="display:none;">
        <div class="section-header">
          <h2>结果预览</h2>
          <button id="btnCollapseTable" class="btn btn-ghost btn-small">收起</button>
        </div>
        <div id="tableArea">
          <div class="table-toolbar">
            <input type="text" id="searchBox" class="input input-search" placeholder="搜索...">
            <span id="resultCount" class="hint-text">0 行</span>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="col-station">工位</th>
                  <th class="col-desc">动作描述</th>
                  <th class="col-var">动作变量</th>
                  <th class="col-start">开始标签</th>
                  <th class="col-end">结束标签</th>
                  <th class="col-remark">备注</th>
                </tr>
              </thead>
              <tbody id="resultBody">
                <tr><td colspan="6" class="empty-cell">无数据</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </section>

      <!-- 交付文件下载 -->
      <section id="sectionDownload" class="section" style="display:none;">
        <div class="section-header"><h2>交付文件</h2></div>
        <div class="download-list" id="downloadList"></div>
      </section>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📋</div>
        <p>从左侧选择历史 Run，或点击「+ 发起新任务」</p>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
